# Design v3: depth-only view gate on Gaussian surfels whose uncertainty renders (3DGS camp).
# Faults are regional and appearance-driven; the gate must beat cheap baselines. Old configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h5_rendered_uncertainty_calibration
status: preregistered_draft
design: v3_rendered_uncertainty_gate
hypothesis:
  id: H5
  prediction: 'With independent per-surfel blocks the rendered variance is overconfident: on fault-free
    views the raw mean T/dof exceeds 1.2; after deflation by n_eff/n or threshold calibration the per-view
    false-alarm rate lies in [0.5, 1.5] alpha without per-scene retuning.'
  falsification_criterion: Falsified if the calibrated false-alarm rate leaves [0.5, 1.5] alpha on test
    scenes.
  independent_variables: [information_deflation, threshold_calibration]
  controlled_variables: [depth_maps, poses, surfel_fit, fault_seeds, scene_set]
  levels:
    information_deflation: [1.0, n_eff_over_n]
baselines: [gate, gate_deflated]
metrics:
  primary: [mean_T_over_dof_raw, mean_T_over_dof_deflated, false_alarm_vs_alpha]
  raw_overconfidence_min: 1.2
implemented: false

# Design v3.3: depth-only view gate on Gaussian surfels whose uncertainty renders (3DGS camp).
# Reference design: docs/design-3dgs-bayes.md (sections 1-4, 9, 10; section 8 belongs to a separate paper).
# Faults are regional and appearance-driven; the gate must beat cheap baselines. Old configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: breakdown_low_overlap_untestable
status: preregistered_draft
design: v3_rendered_uncertainty_gate
hypothesis:
  id: breakdown
  prediction: Regions seen by few other views are untestable; report the untestable rate and the detection
    on the rest.
  falsification_criterion: Falsified only if the gate asserts decisions on untestable pixels.
  independent_variables: [overlap_fraction]
  controlled_variables: [depth_maps, poses, surfel_fit, fault_seeds, scene_set]
  levels:
    overlap_fraction: [0.1, 0.3, 0.5]
baselines: [no_gate, gate, aligned_rms]
metrics:
  primary: [detection_power_at_fa_0.05, untestable_rate, fscore]
implemented: false

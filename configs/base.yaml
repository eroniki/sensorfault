# Design v3.3: depth-only view gate on Gaussian surfels whose uncertainty renders (3DGS camp).
# Reference design: docs/design-3dgs-bayes.md (sections 1-4, 9, 10; section 8 belongs to a separate paper).
# Faults are regional and appearance-driven; the gate must beat cheap baselines. Old configs: configs/legacy_sensor_faults/.
# Shared defaults. Experiment configs `extends: base.yaml`.
project: sensorfault
design: v3_rendered_uncertainty_gate
status: preregistered_draft
seeds:
  master: [101, 102, 103, 104, 105]
scenes:
  split_rule: dev scenes for ALL threshold tuning and the residual measurement; test scenes only after
    git tag prereg-v1
  dev: [usegeo_set_1, eth3d_courtyard]
  test: [usegeo_set_2, usegeo_set_3, eth3d_delivery_area, eth3d_facade, eth3d_terrace]
  synthetic: matrixcity aerial blocks (fault injection; split TODO)
  note: TODO(verify) UseGeo set naming and ETH3D scene names/licence
poses: {input: 'posed images (exterior orientation, GNSS/IMU, or registered poses)', trajectory: 'uniform
    cubic B-spline in time; positions by the standard basis, rotations by the cumulative form on SO(3)',
  fit: control points to GNSS/IMU or dataset poses with a second-difference smoothness prior, refinement: 'differentiable
    pose-graph optimisation: GNSS/IMU prior + smoothness + render-and-compare depth terms (optionally
    photometric render-and-compare); no feature correspondences', tested_pose: the tested view's render-and-compare
    term is subtracted from the control-point information before its pose is used; Sigma_q = b(t_j) Sigma_ctrl
    b(t_j)^T enters Sigma_r, knot_spacing_s: TODO fix on dev (about 1 s), ablation: perturbed starting
    poses, eth3d: registered poses used as given, pose_faults: out of scope in this paper, theory_module: src/sensorfault/eval/trajectory_spline.py}
depth_model:
  default: depth_pro
  file: depth_models/depth_models.yaml
  one_model_per_image: true
  confidence_models_for_baseline: [metric3d_v2, unidepth_v2]
surface:
  representation: 2dgs_surfels
  renderer: gsplat
  rendered: [expected_depth, alpha_weights, accumulated_opacity]
  shape_covariance: rendering only (mu, R, scales, opacity)
  fit: depth-supervised splatting of all views at dataset poses
appearance: {block: separate (colour / SH per surfel), updates_map_geometry: false, updates_opacity: false,
  refines_poses: true, colour_reaches_map_geometry: only through the depth model, implementation: photometric
    gradients stopped at surfel geometry and opacity; photometric render-and-compare may refine the spline
    control points, gate_inputs: depth only}
uncertainty:
  state: [d_mu_x, d_mu_y, d_mu_z, d_phi_1, d_phi_2, d_phi_3, d_log_s_1, d_log_s_2, d_log_s_3, d_logit_alpha]
  dim: 10
  rotation_error: tangent space (body frame), R <- R exp([d_phi]x)
  form: information, one 9x9 block per surfel
  rendered_subblock: [normal_offset_nu, tilt_tau1, tilt_tau2]
  fusion: 'Laplace at the MAP: Lambda_k = Lambda_0 + sum_i sum_u a^2 g_u^T g_u / sigma_u^2, g_u = alpha-weighted
    rasteriser Jacobian of the rendered depth'
  leave_view_out: subtraction Lambda_{-j} = Lambda - Lambda_j plus one Newton step mu_{-j} = mu + Lambda_{-j}^-1
    grad L_j on the 9 geometric coordinates (infinitesimal jackknife; one backward pass of view j)
  tested_view_spawns: 'nothing: surfels without enough information from the other views are dropped from
    the leave-j-out render'
  support_rule: normal-offset information from other views >= lam_min (TODO fix on dev) AND the opacity
    rule
  untestable: pixels with no supported surfel (unseen by other views)
  correspondences: none
  limitation: 'independent per-surfel blocks ignore cross-surfel, within-view and shared-pose correlations:
    rendered variance is overconfident (stated; no deeper fix in this paper)'
  theory_module: src/sensorfault/eval/gaussian_uncertainty.py
  opacity: {coordinate: 10th (logit alpha), observed_through: compositing weights (dD/dlogit alpha incl.
      transmittance), schedule: 'trained during warm-up on depth only, then frozen; not re-estimated in
      the leave-out', support_rule: 'drop surfel k from view j leave-out render if Lambda_j[a,a] / Lambda[a,a]
      > rho', rho: 0.5, warmup_iterations: TODO fix on dev (3-7k), densify: only where >= 2 views support
      a split or clone, prune: alpha < alpha_min during warm-up only}
  overconfidence_ablations: [information_deflation_n_eff_over_n, jackknife_inflation]
measurement_model:
  nominal: d_hat = a_i * (d + beta * d^2) + b_i + eps  (per-view scale/offset absorbed; beta shared by
    all views)
  eps: {covariance: Sigma_eps = gamma^2 * D C D, D: 'diag sigma(range, texture, grazing_angle) (shape,
      calibrated offline on dev)', C: '(1-nu) K_ell + nu I (shape, calibrated offline on dev)'}
  residual_variance: gamma^2 sigma_d^2(u) + a^2 * rendered variance of the leave-j-out surface
  calibration:
    first_task: true
    fit_on: ETH3D dev, Depth Pro, aligned residuals vs laser depth
    fit: ['sigma(range,texture,grazing)', ell, nu, tails, omega, gamma_range, beta]
  fault_definition: a regional deviation the nominal model cannot explain; whole-view affine errors are
    absorbed and are NOT faults
  noise_parameters:
    free: [gamma (one scene temperature)]
    per_view: none
    per_pixel: none
    gamma_estimator: 'leave-view-out: gamma^2_{-j} solves median_{i!=j} T_i(gamma)/q_0.5(chi2_{m_i}) =
      1'
    heterogeneity_omega: sd of log noise scale across clean dev views after temperature scaling; the energy
      threshold absorbs it (week-2 number)
    scene_alarm: 'gamma_hat > gamma_max (fixed on dev): model inadequate for the scene'
    reference: Guo et al. 2017 temperature scaling
  shared_bias: {term: distance, model: 'd -> d + beta d^2, beta shared by all views', fit: least squares;
      leave-view-out by subtracting the tested view normal equations, extend_to: grazing or texture terms
      only if ETH3D dev residuals show them, per_view_bias_field: not in this paper (separate paper)}
integrity:
  false_alarm_per_view: 0.05
  missed_detection: 0.1
  threshold_calibration: clean_run_permutation_on_dev
  statistics: [energy_whitened (threshold absorbs omega; n_eff dof), region_scan_matched]
  alarms: [untestable_view, scene_level_if_more_than_half_rejected]
  theory_module: src/sensorfault/eval/detection_theory.py
  iterative_exclusion: 'outer loop (see outer_loop): one Holm-rejected view dropped per round, retrain,
    re-test'
metrics:
  measurement: [fitted_sigma_ell_nu, tail_index, failure_area_fraction, failure_magnitude_sigma, failure_harm]
  detection: [detection_power_at_fa_0.05, false_alarm_rate, untestable_rate, availability, elimination_curve_auc]
  reconstruction: [heldout_laser_depth_absrel, surface_accuracy, surface_completeness, fscore]
  repetition: [cross_view_error_correlation_textureless, cross_view_error_correlation_reflective, cross_view_error_correlation_textured,
    cross_view_error_correlation_vs_frame_separation]
  calibration: [mean_T_over_dof_raw, mean_T_over_dof_temperature_scaled, false_alarm_vs_alpha, gamma_hat_per_scene,
    omega]
  cost: [runtime_s_per_stage, gpu_mem_gb_per_stage]
stats: {bootstrap: scene_level, bootstrap_n: 10000, paired_test: wilcoxon_signed_rank, alpha: 0.05}
implemented: {configs: true, detection_theory: true, gaussian_uncertainty_theory: true, residual_measurement: false,
  splatting_pipeline: false, view_gate: false, temperature_and_heterogeneity_theory: true, gate_loop_logic: true,
  trajectory_spline_theory: true, leave_block_out_theory: true}
output_dir: outputs
outer_loop:
  enabled: true
  round: train (opacity unfrozen, densify/prune on, warm-started from the previous round) -> freeze ->
    fuse -> test
  round_cap: 10
  policy: one_per_round (drop only the most significant Holm-rejected view per round; protects against
    swamping)
  exclusion: drop (weight 0); downweight is an ablation
  readmission: false
  stopping: no view rejected in a round, round cap reached, or scene-level alarm (> half excluded)
  false_alarm_control: {procedure: Holm step-down across rounds, family_size: 'M = n_views * round_cap
      (every view in every round, re-tests and readmission tests included)', threshold: (k+1)-th rejection
      overall at alpha / (M - k), calibration: clean-run permutation of the whole loop}
  framing: Baarda-style iterative data snooping and hard EM (gate = E-step, train = M-step); EP cavity
    within each round; known ideas, not a contribution
  differentiability: gradients only inside the train step; fusion and test are not differentiated
  theory_module: src/sensorfault/eval/gate_loop.py
setting:
  main: aerial survey imagery (UAV nadir, flight strips, GNSS/IMU or exterior orientation)
  datasets:
    main_real: usegeo
    second_real: 'h3d (pending: raw images and orientations unconfirmed)'
    synthetic: matrixcity
    sanity_check: eth3d
    fallback_real: isprs_vaihingen
    dropped: [scannetpp]
  domain_note: monocular depth models are trained mostly near the ground; nadir views from survey altitude
    are a different failure regime (measured in H1)
leave_block_out:
  block: B neighbouring frames of the same flight strip, centred on the tested view, shifted inwards at
    strip ends, never across strips
  block_size_B: chosen on dev from the sweep
  sweep: [1, 3, 5, 9]
  ablation: B = 1 (single-view leave-out)
  subtraction: 'exact: subtract the block''s summed information, one Newton step with its summed gradient'
  tested: only the centre view is tested against its block cavity; tests are per view
  holm_family: unchanged, M = n_views * round_cap (block-level testing would be ceil(N/B) * round_cap;
    not used)
  outer_loop: a rejected view is dropped alone; its neighbours are re-tested next round
  cost: 'weaker cavity: larger rendered variance, higher MDB, more untestable pixels'
  motivation: 'H2: neighbouring frames repeat the same error'

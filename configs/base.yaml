# Design v3: depth-only view gate on Gaussian surfels whose uncertainty renders (3DGS camp).
# Faults are regional and appearance-driven; the gate must beat cheap baselines. Old configs: configs/legacy_sensor_faults/.
# Shared defaults. Experiment configs `extends: base.yaml`.
project: sensorfault
design: v3_rendered_uncertainty_gate
status: preregistered_draft
seeds:
  master: [101, 102, 103, 104, 105]
scenes:
  source: eth3d
  split_rule: dev scenes for ALL threshold tuning and the residual measurement; test scenes only after
    git tag prereg-v1
  dev: [courtyard, electro, kicker]
  test: [delivery_area, facade, office, pipes, relief, terrace]
secondary_dataset: {source: scannetpp, scenes: TODO after accepting the dataset terms}
poses: dataset poses (ETH3D calibrated, ScanNet++ registered); pose faults are out of scope
depth_model:
  default: depth_pro
  file: depth_models/depth_models.yaml
  one_model_per_image: true
  confidence_models_for_baseline: [metric3d_v2, unidepth_v2]
surface:
  representation: 2dgs_surfels
  renderer: gsplat
  rendered: [expected_depth, alpha_weights, accumulated_opacity]
  shape_covariance: rendering only (mu, R, scales, opacity)
  fit: depth-supervised splatting of all views at dataset poses
appearance: {block: separate (colour / SH per surfel), updates_geometry: false, colour_reaches_geometry: only
    through the depth model, implementation: photometric loss gradients are stopped at the geometry parameters,
  gate_inputs: depth only}
uncertainty:
  state: [d_mu_x, d_mu_y, d_mu_z, d_phi_1, d_phi_2, d_phi_3, d_log_s_1, d_log_s_2, d_log_s_3]
  dim: 9
  rotation_error: tangent space (body frame), R <- R exp([d_phi]x)
  form: information, one 9x9 block per surfel
  rendered_subblock: [normal_offset_nu, tilt_tau1, tilt_tau2]
  fusion: Lambda_k += sum_u a^2 (w_uk J_uk)^T (w_uk J_uk) / sigma_u^2 (alpha-weighted rasteriser Jacobians)
  leave_view_out: subtraction of view j information (exact for the linearised model)
  tested_view_spawns: 'nothing: surfels without enough information from the other views are dropped from
    the leave-j-out render'
  support_rule: normal-offset information from other views >= lam_min (TODO fix on dev)
  untestable: pixels with no supported surfel (unseen by other views)
  correspondences: none
  limitation: 'independent per-surfel blocks ignore cross-surfel, within-view and shared-pose correlations:
    rendered variance is overconfident'
  deflation_ablation: scale view information by n_eff/n
  theory_module: src/sensorfault/eval/gaussian_uncertainty.py
measurement_model:
  nominal: d_hat = a*d + b + eps (per-view scale/offset absorbed by alignment)
  eps: {covariance: Sigma_eps = D C D, D: 'diag sigma(range, texture, grazing_angle)', C: (1-nu) K_ell
      + nu I}
  residual_variance: sigma_d^2(u) + a^2 * rendered variance of the leave-j-out surface
  calibration:
    first_task: true
    fit_on: ETH3D dev, Depth Pro, aligned residuals vs laser depth
    fit: ['sigma(range,texture,grazing)', ell, nu, tails]
  fault_definition: a regional deviation the nominal model cannot explain; whole-view affine errors are
    absorbed and are NOT faults
integrity:
  false_alarm_per_view: 0.05
  missed_detection: 0.1
  threshold_calibration: clean_run_permutation_on_dev
  statistics: [energy_whitened, region_scan_matched]
  alarms: [untestable_view, scene_level_if_more_than_half_rejected]
  theory_module: src/sensorfault/eval/detection_theory.py
metrics:
  measurement: [fitted_sigma_ell_nu, tail_index, failure_area_fraction, failure_magnitude_sigma, failure_harm]
  detection: [detection_power_at_fa_0.05, false_alarm_rate, untestable_rate, availability, elimination_curve_auc]
  reconstruction: [heldout_laser_depth_absrel, surface_accuracy, surface_completeness, fscore]
  repetition: [cross_view_error_correlation_textureless, cross_view_error_correlation_reflective, cross_view_error_correlation_textured]
  calibration: [mean_T_over_dof_raw, mean_T_over_dof_deflated, false_alarm_vs_alpha]
  cost: [runtime_s_per_stage, gpu_mem_gb_per_stage]
stats: {bootstrap: scene_level, bootstrap_n: 10000, paired_test: wilcoxon_signed_rank, alpha: 0.05}
implemented: {configs: true, detection_theory: true, gaussian_uncertainty_theory: true, residual_measurement: false,
  splatting_pipeline: false, view_gate: false}
output_dir: outputs

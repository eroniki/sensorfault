# Design v2: view-level gate (contribution) + monocular-depth test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
# Shared defaults. Experiment configs `extends: base.yaml`.
project: sensorfault
design: v2_view_level_gate
status: preregistered_draft
seeds:
  master: [101, 102, 103, 104, 105]
scenes:
  source: eth3d
  split_rule: dev scenes are used for ALL threshold tuning; test scenes are touched only after git tag
    prereg-v1
  dev: [courtyard, electro, kicker]
  test: [delivery_area, facade, office, pipes, relief, terrace]
estimators:
  ensemble_file: estimators/ensemble.yaml
  M: [3, 4, 5]
metrics:
  pose: [ate_rmse_sim3, rpe, pose_auc_at_5_10_30deg]
  surface: [accuracy, completeness, fscore]
  depth: [absrel, delta1_after_alignment]
  gate: [precision, recall, false_exclusion_rate_clean, power_at_fer_0.05, elimination_curve_auc]
  cost: [runtime_s_per_stage, gpu_mem_gb_per_stage]
stats: {bootstrap: scene_level, bootstrap_n: 10000, paired_test: wilcoxon_signed_rank, alpha: 0.05}
tuning:
  dev_only: true
  budget_reported: true
  null_calibration: {target_false_exclusion: 0.05, method: clean_run_permutation, n_permutations: 200}
shared_inputs_for_all_methods: [images, matches, depth_ensemble, fault_realisations, pose_graph_solver]
implemented: {configs: true, fault_injectors: false, view_gate: false, testbed_pipeline: false, note: 'Only
    configs, registry stubs (baselines/gate_testbed.py) and the grid-form admission test (elim/admission.py)
    exist.'}
output_dir: outputs

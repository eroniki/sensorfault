# Design v2.5: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: breakdown_association_failure
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: breakdown
  prediction: 'Association failure and cold start: the first views fix the primitives, so the result depends
    on view order; a faulty view with a large offset spawns separate primitives that no other view can
    test.'
  falsification_criterion: Report power and no-consensus rate versus view order and offset size; expect
    degradation (links to the untestable-region limitation). Not a falsifier.
  independent_variables: [view_order, fault_offset_sigma, n_views_at_cold_start]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    view_order: [sequential, random, adversarial]
    fault_offset_sigma: [2, 5, 20]
    n_views_at_cold_start: [2, 3, 5]
baselines: [no_gate, gate_surface_evidence, rk_huber, vote_median, colmap_geom_consistency, soft_view_weights]
metrics:
  primary: [detection_power_at_fa_0.05, no_consensus_rate, ate_rmse_sim3, fscore]
implemented: false

# Design v3: depth-only view gate on Gaussian surfels whose uncertainty renders (3DGS camp).
# Faults are regional and appearance-driven; the gate must beat cheap baselines. Old configs: configs/legacy_sensor_faults/.
target: regions of the depth map of selected views
seed_rule: SeedSequence([master, stable_hash(view_id), fault_id])
no_sub_noise_claims: true
natural_failures:
  kinds: [reflective_or_glass, textureless_wall, other]
  label_rule: aligned error vs laser depth > k sigma on a connected region >= min_area
  k_sigma: TODO fix on dev
  min_area_fraction: TODO fix on dev
  appearance_class: from the image (specular / low-texture masks) and the laser reference
injected_regional:
  region_source: [appearance_masks_reflective, appearance_masks_textureless, random_connected_superpixels]
  area_fraction: [0.02, 0.05, 0.1, 0.2, 0.4]
  magnitude_sigma: [2, 4, 8, 16]
  type: [offset_region, plane_replacement, blurred_copy, mirror_depth]
  across_views: [independent_per_view, repeated_same_error_across_views]
controls:
  fault_free: true
  whole_view_affine: {absorbed: true, prediction: 'not detected, not harmful'}
implemented: false

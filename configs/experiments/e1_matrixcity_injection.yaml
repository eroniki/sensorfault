# Experiment E1 (first gate experiment, design v3.4 frozen). Script: experiments/e1_matrixcity_injection.py
id: e1_matrixcity_injection
status: completed 2026-11-15 (results/e1: clean.json, grid.json, repeat.json, summary.md)
data:
  dataset: MatrixCity (CC BY-NC 4.0, Hugging Face BoDai/MatrixCity)
  block: small_city aerial train block_3 (185 frames; 8x8 positions x 4 headings, 30 deg oblique, 300 m)
  files: [small_city_depth_float32/aerial/train/block_3_depth.tar (0.76 GB), small_city/aerial/train/block_3/transforms.json]
  images: not downloaded (the gate is depth-only)
scope:
  tests: [information-form fusion on rendering, leave-view-out and leave-block-out, whitening, scene temperature, region scan, Holm outer loop, aligned-RMS baseline]
  not_tested: [gsplat training, opacity and densification, pose refinement, real depth model, spatially correlated noise]
  surfels: voxel-merged back-projections of the exact depth (3 m voxels), planes from depth gradients
  measurement: rendered surfel depth + N(0, (0.01 d)^2) + injected faults; linearised fusion exact for this model
conditions:
  clean: {seeds: 20, noise_scale: [1.0, 1.3], temperature: [on, off]}
  single_view_region_fault: {delta_sigma: [2, 4, 8, 16], area: [0.05, 0.1, 0.2, 0.4], seeds: 10}
  repeated_fault_on_neighbouring_frames: {n_views: 3, delta_sigma: 8, radius_m: 25, seeds: 10, noise_scale: [1.0, 1.3], B: [1, 3], loop: [off, on], whiten: [on, off]}
statistics: {alpha: 0.05, holm_family: n_views x round_cap, round_cap: 10, scan_regions: 4x6 image tiles}
limits: {threads: "<= 8 (OMP 4 used)", heavy_jobs: one at a time, compute: local CPU only}

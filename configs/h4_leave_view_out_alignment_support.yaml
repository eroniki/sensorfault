# Design v2.5: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h4_leave_view_out_alignment_support
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H4
  prediction: Testing a depth map against a surface from which its view has been SUBTRACTED, after a scale-and-shift
    fit to the rendering, and only on pixels the surface supports, keeps clean false alarm <=5%; testing
    against a joint surface containing the view lowers power by >=10 points (the surface absorbs the fault);
    removing the support mask at least doubles the false-alarm rate.
  falsification_criterion: Falsified if the ablations leave false-alarm rate and power unchanged.
  independent_variables: [leave_view_out, support_mask, grazing_gate, alignment]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    leave_view_out: [subtraction, joint, mcmc_explicit_refit]
    support_mask: [true, false]
    grazing_gate: [true, false]
baselines: [gate_surface_evidence, gate_surface_joint_fit, gate_surface_mcmc_fixed_budget]
metrics:
  primary: [false_alarm_rate, detection_power_at_fa_0.05]
implemented: false
ablations: ablations_gate.yaml

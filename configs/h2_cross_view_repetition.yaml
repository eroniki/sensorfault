# Design v3.4: depth-only view gate on Gaussian surfels whose uncertainty renders (3DGS camp).
# Reference design: docs/design-3dgs-bayes.md (sections 1-4, 9, 10; section 8 belongs to a separate paper).
# Faults are regional and appearance-driven; the gate must beat cheap baselines. Old configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h2_cross_view_repetition
status: preregistered_draft
design: v3_rendered_uncertainty_gate
hypothesis:
  id: H2
  prediction: 'The depth model repeats its error across views: correlation of aligned errors at the same
    reference surface point >= 0.5 on textureless regions, <= 0.3 on specular and <= 0.2 on textured,
    decreasing with frame separation along the strip; the decay sets the block size B. The gate is blind
    to errors repeated beyond the block.'
  falsification_criterion: Falsified if the textureless correlation is below 0.5 or not above the reflective
    one by at least 0.2.
  independent_variables: [appearance_class, baseline_angle]
  controlled_variables: [depth_maps, poses, surfel_fit, fault_seeds, scene_set]
  levels:
    appearance_class: [textureless_roof_road_wall, specular_glass_water, textured]
    frame_separation: [1, 2, 4, 8, 16]
baselines: [no_gate]
metrics:
  primary: [cross_view_error_correlation_textureless, cross_view_error_correlation_reflective, cross_view_error_correlation_textured,
    cross_view_error_correlation_vs_frame_separation]
  textureless_min: 0.5
  reflective_max: 0.3
  textured_max: 0.2
implemented: false

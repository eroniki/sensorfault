# Design v3: depth-only view gate on Gaussian surfels whose uncertainty renders (3DGS camp).
# Faults are regional and appearance-driven; the gate must beat cheap baselines. Old configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h2_cross_view_repetition
status: preregistered_draft
design: v3_rendered_uncertainty_gate
hypothesis:
  id: H2
  prediction: 'In textureless regions the depth model repeats the same error across views: the correlation
    of aligned errors at the same laser surface point across view pairs is >=0.5, versus <=0.3 on reflective
    regions (view-dependent) and <=0.2 on textured regions. The gate is then blind to textureless failures
    (common mode).'
  falsification_criterion: Falsified if the textureless correlation is below 0.5 or not above the reflective
    one by at least 0.2.
  independent_variables: [appearance_class, baseline_angle]
  controlled_variables: [depth_maps, poses, surfel_fit, fault_seeds, scene_set]
  levels:
    appearance_class: [textureless_wall, reflective_or_glass, textured]
baselines: [no_gate]
metrics:
  primary: [cross_view_error_correlation_textureless, cross_view_error_correlation_reflective, cross_view_error_correlation_textured]
  textureless_min: 0.5
  reflective_max: 0.3
  textured_max: 0.2
implemented: false

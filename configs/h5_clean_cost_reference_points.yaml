# Design v2: view-level gate (contribution) + monocular-depth test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h5_clean_cost_reference_points
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H5
  prediction: On fault-free data the gate changes trajectory and fused-surface error by <=5% relative
    to the pipeline without it (price of gating); on natural failures the gated test bed narrows the gap
    to the reference points MASt3R-SfM and VGGT, reported as context.
  falsification_criterion: Falsified if the price of gating on clean data exceeds 5%. Reference points
    are context only; no claim to beat them.
  independent_variables: [data_kind_clean_or_natural, dataset]
  controlled_variables: [images, matches, depth_ensemble, pose_graph_solver, fault_seeds, scene_set]
  levels:
    data_kind: [clean, natural_failures]
baselines: [no_gate, gate_surface_evidence, mast3r_sfm, vggt, colmap_sfm]
metrics:
  primary: [ate_rmse_sim3, fscore, pose_auc_at_5_10_30deg]
  clean_cost_threshold: 0.05
implemented: false

# Design v2.3: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h8_pose_faults
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H8
  prediction: (a) For spoofed pose priors and glitches the gate detects >=80% of views whose pose error
    exceeds the MDB implied by delta_min through the pointing-error term, and excluding them lowers trajectory
    error vs robust kernels. (b) For LARGE false loop closures, switchable constraints, DCS and max-mixtures
    (designed for them) match the gate within 5 points; the gate is not expected to win. (c) For small
    coherent pose offsets (<=0.5 deg) the gate beats every robust kernel by >=20 points of power.
  falsification_criterion: Falsified if (a) power above the MDB is <80%, (b) the gate beats the best loop-closure
    baseline by >10 points, or (c) the CI of the gap in (c) includes 0.
  independent_variables: [pose_fault_kind, pose_error_magnitude, n_false_loop_closures]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    pose_fault: [spoofed_prior, intermittent_glitch, small_coherent_offset, false_loop_closure]
baselines: [rk_huber, rk_cauchy, rk_gm_gnc, rk_switchable, rk_dcs, rk_max_mixture, soft_view_weights,
  gate_surface_combined, gate_surface_evidence]
metrics:
  primary: [detection_power_at_fa_0.05, ate_rmse_sim3]
  mdb_power_threshold: 0.8
  loop_closure_tie_points: 5
  small_offset_gap_points: 20
implemented: false
scenario_grid:
  grid: faults/view_fault_grid.yaml
  classes: [spoofed_prior, intermittent_glitch, false_loop_closure]

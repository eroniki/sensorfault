# Design v2: view-level gate (contribution) + monocular-depth test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: breakdown_m2
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: breakdown
  prediction: 'M=2: attribution is unidentifiable; the gate must return no consensus.'
  falsification_criterion: Falsified only if the gate attributes with accuracy clearly above 50% from
    symmetric residuals alone.
  independent_variables: [M]
  controlled_variables: [images, matches, depth_ensemble, pose_graph_solver, fault_seeds, scene_set]
  levels:
    M: [2]
baselines: [no_gate, gate_evidence, rk_huber, vote_median, colmap_geom_consistency]
metrics:
  primary: [ate_rmse_sim3, fscore, precision, recall]
implemented: false

# Design v2: view-level gate (contribution) + monocular-depth test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h3_cross_fitting_alignment_support
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H3
  prediction: Testing a source against a surface fitted WITHOUT its view, after a scale-and-shift fit
    of the source to the rendering, and only on pixels the surface supports, keeps clean-run false exclusion
    <=5%; fitting the surface to all views (including the source under test) lowers detection power by
    >=10 points (the surface absorbs the fault), and removing the support mask at least doubles the false-exclusion
    rate.
  falsification_criterion: Falsified if the ablations leave false-exclusion rate and power unchanged.
  independent_variables: [cross_fitting, support_mask, grazing_gate, alignment]
  controlled_variables: [images, matches, depth_ensemble, pose_graph_solver, fault_seeds, scene_set]
  levels:
    cross_fit: [k_fold, joint, exact_leave_one_view_out]
    support_mask: [true, false]
    grazing_gate: [true, false]
baselines: [gate_surface_evidence, gate_surface_joint_fit, gate_surface_exact_loo]
metrics:
  primary: [false_exclusion_rate_clean, power_at_fer_0.05]
implemented: false
ablations: ablations_gate.yaml

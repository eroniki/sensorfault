# Design v2.3: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h1_regime_map_subnoise_bias
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H1
  prediction: 'One metric model, a coherent bias of delta*sigma on a fraction f of one view, 5% false
    alarm: (a) the gate empirical minimum detectable bias follows delta_min=(z_a+z_b)/(f*sqrt(n_eff))
    within a factor of 2; (b) in the sub-noise regime (delta<=0.5, f>=0.2) the gate detects >=80% of faulty
    views while the best pixel filter, robust kernel and soft weight each detect <=20%; (c) in the sparse-outlier
    regime (delta>=4, f<=0.02) the best pixel filter detects at least as many views as the gate (the gate
    is not expected to win).'
  falsification_criterion: Falsified if (a) empirical and predicted MDB differ by more than 2x, (b) the
    detection gap at delta=0.3,f=1 is <30 points or its CI includes 0, or (c) the gate beats the best
    pixel filter by >=10 points in the sparse-outlier regime.
  independent_variables: [delta_sigma, fraction_f, mask_layout, n_eff]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set, per_view_false_alarm]
  levels:
    delta_sigma: [0.1, 0.2, 0.3, 0.5, 1, 2, 4]
    fraction_f: [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1]
    mask_layout: [contiguous, scattered]
baselines: [colmap_geom_consistency, pixel_count_test, rk_huber, rk_cauchy, rk_gm_gnc, soft_view_weights,
  gate_surface_mean_shift, gate_surface_combined, gate_surface_evidence]
metrics:
  primary: [detection_power_at_fa_0.05, empirical_mdb]
  mdb_tolerance_factor: 2
  subnoise_gap_points: 30
  sparse_outlier_gate_win_points: 10
implemented: false
scenario_grid:
  grid: faults/view_fault_grid.yaml
  classes: [coherent_bias]
key_figure: regime_map heatmaps with predicted MDB contour

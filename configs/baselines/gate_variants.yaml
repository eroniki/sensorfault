# Design v2.4: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
baselines:
- id: no_gate
  family: floor
  fuser: no_gate
  params: {}
- id: oracle_gate
  family: upper_bound
  fuser: oracle_gate
  params: {}
- id: gate_surface_evidence
  family: gate
  fuser: view_gate
  params: {consensus: shared_surface, statistic: evidence, cross_fit: true, densification: fixed_N}
- id: gate_surface_chi2
  family: gate
  fuser: view_gate
  params: {consensus: shared_surface, statistic: energy_whitened_projected, cross_fit: true, densification: fixed_N}
- id: gate_surface_region_scan
  family: gate
  fuser: view_gate
  params: {consensus: shared_surface, statistic: region_scan_matched, cross_fit: true, densification: fixed_N}
- id: gate_surface_combined
  family: gate
  fuser: view_gate
  params: {consensus: shared_surface, statistic: combined_region_scan_energy, cross_fit: true, densification: fixed_N}
- id: gate_pairwise_evidence
  family: gate
  fuser: view_gate
  params: {consensus: pairwise, statistic: evidence}
- id: gate_pairwise_chi2
  family: gate
  fuser: view_gate
  params: {consensus: pairwise, statistic: energy_whitened_projected}
- id: gate_surface_joint_fit
  family: ablation
  fuser: view_gate
  params: {consensus: shared_surface, statistic: evidence, cross_fit: false, densification: fixed_N}
- id: gate_surface_adaptive
  family: ablation
  fuser: view_gate
  params: {consensus: shared_surface, statistic: evidence, cross_fit: true, densification: adaptive_matched_final_N}
- id: gate_surface_exact_loo
  family: reference_expensive
  fuser: view_gate
  params: {consensus: shared_surface, statistic: evidence, cross_fit: exact_leave_one_view_out, densification: fixed_N}
- id: estimate_and_correct
  family: context
  fuser: estimate_and_correct
  params: {}

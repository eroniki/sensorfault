# Design v3.2: depth-only view gate on Gaussian surfels whose uncertainty renders (3DGS camp).
# Reference design: docs/design-3dgs-bayes.md (sections 1-4, 9, 10; section 8 belongs to a separate paper).
# Faults are regional and appearance-driven; the gate must beat cheap baselines. Old configs: configs/legacy_sensor_faults/.
baselines:
- id: no_gate
  family: floor
  fuser: no_gate
  params: {}
- id: oracle_gate
  family: upper_bound
  fuser: oracle_gate
  params: {}
- id: gate
  family: gate
  fuser: view_gate
  params: {uncertainty: rendered_10x10_opacity_frozen, leave_view_out: subtraction, spawn: none, statistic: combined_region_scan_energy,
    noise: scene_temperature, shared_bias: distance}
- id: gate_joint
  family: ablation
  fuser: view_gate
  params: {leave_view_out: none_joint}
- id: gate_keep_unsupported
  family: ablation
  fuser: view_gate
  params: {spawn: keep_view_j_only_surfels}
- id: gate_unwhitened
  family: ablation
  fuser: view_gate
  params: {uncertainty: constant_sigma}
- id: gate_deflated
  family: ablation
  fuser: view_gate
  params: {information_deflation: n_eff_over_n}
- id: gate_fisherrf_diag
  family: ablation
  fuser: view_gate
  params: {uncertainty: fisherrf_style_diagonal_fisher}
- id: gate_bayesrays
  family: ablation
  fuser: view_gate
  params: {uncertainty: bayes_rays_style_perturbation_field}
- id: gate_jackknife_inflated
  family: ablation
  fuser: view_gate
  params: {overconfidence: jackknife_inflation}
- id: gate_no_temperature
  family: ablation
  fuser: view_gate
  params: {noise: dev_calibrated_level_only}
- id: gate_no_shared_bias
  family: ablation
  fuser: view_gate
  params: {shared_bias: none}
- id: gate_foldwise_warmup
  family: ablation
  fuser: view_gate
  params: {opacity_warmup: fold_wise_K5}
- id: gate_single_pass
  family: ablation
  fuser: view_gate
  params: {outer_loop: off (round_cap 1)}
- id: gate_drop_all_rejected
  family: ablation
  fuser: view_gate
  params: {outer_loop_policy: all_rejected}
- id: gate_downweight
  family: ablation
  fuser: view_gate
  params: {outer_loop_exclusion: downweight, downweight: 0.1}
- id: gate_readmit
  family: ablation
  fuser: view_gate
  params: {outer_loop_readmission: true}

# Design v3: depth-only view gate on Gaussian surfels whose uncertainty renders (3DGS camp).
# Faults are regional and appearance-driven; the gate must beat cheap baselines. Old configs: configs/legacy_sensor_faults/.
baselines:
- id: no_gate
  family: floor
  fuser: no_gate
  params: {}
- id: oracle_gate
  family: upper_bound
  fuser: oracle_gate
  params: {}
- id: gate
  family: gate
  fuser: view_gate
  params: {uncertainty: rendered_9x9, leave_view_out: subtraction, spawn: none, statistic: combined_region_scan_energy}
- id: gate_joint
  family: ablation
  fuser: view_gate
  params: {leave_view_out: none_joint}
- id: gate_keep_unsupported
  family: ablation
  fuser: view_gate
  params: {spawn: keep_view_j_only_surfels}
- id: gate_unwhitened
  family: ablation
  fuser: view_gate
  params: {uncertainty: constant_sigma}
- id: gate_deflated
  family: ablation
  fuser: view_gate
  params: {information_deflation: n_eff_over_n}
- id: gate_fisherrf_diag
  family: ablation
  fuser: view_gate
  params: {uncertainty: fisherrf_style_diagonal_fisher}
- id: gate_bayesrays
  family: ablation
  fuser: view_gate
  params: {uncertainty: bayes_rays_style_perturbation_field}

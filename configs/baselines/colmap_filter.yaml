# Design v2.4: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
baselines:
- id: colmap_geom_consistency
  family: pixel_filter
  fuser: colmap_consistency_filter
  params: {min_consistent_views: 2, max_reproj_error_px: 2.0, max_rel_depth_error: 0.01}
- id: pixel_count_test
  family: pixel_filter_aggregated
  fuser: pixel_count_test
  params: {k_sigma: 3.0, aggregate: count_over_visible_pixels, false_alarm: 0.05, note: 'strongest pixel-based
      competitor; theory: eval/detection_theory.py'}

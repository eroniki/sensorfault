# Design v2.5: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
baselines:
- id: rk_huber
  family: robust_kernel
  fuser: robust_kernel_pgo
  params: {kernel: huber}
- id: rk_cauchy
  family: robust_kernel
  fuser: robust_kernel_pgo
  params: {kernel: cauchy}
- id: rk_gm_gnc
  family: robust_kernel
  fuser: robust_kernel_pgo
  params: {kernel: geman_mcclure_gnc}
- id: rk_switchable
  family: loop_closure_robust
  fuser: robust_kernel_pgo
  params: {kernel: switchable}
- id: rk_dcs
  family: loop_closure_robust
  fuser: robust_kernel_pgo
  params: {kernel: dcs}
- id: rk_max_mixture
  family: loop_closure_robust
  fuser: robust_kernel_pgo
  params: {kernel: max_mixture}

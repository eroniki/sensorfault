# Design v2: view-level gate (contribution) + monocular-depth test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h4_gate_placement
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H4
  prediction: Gating before pose graph optimisation gives lower trajectory error than applying the same
    statistic after the graph, and the gate combined with a robust kernel is at least as accurate as either
    alone.
  falsification_criterion: Falsified if gating after the graph matches gating before it (CI of the difference
    includes 0), or if the combination is worse than the better component.
  independent_variables: [gate_placement, robust_kernel]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    gate_placement: [none, before_pgo, after_pgo]
    robust_kernel: [none, huber, geman_mcclure_gnc]
baselines: [no_gate, gate_surface_evidence, rk_huber, rk_gm_gnc]
metrics:
  primary: [ate_rmse_sim3, rpe]
implemented: false

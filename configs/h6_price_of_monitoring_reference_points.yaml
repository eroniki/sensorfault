# Design v2.5: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h6_price_of_monitoring_reference_points
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H6
  prediction: 'ADEQUACY of the measurement model: on fault-free views mean(T/(n-2)) is 1+/-0.1 and the
    false-alarm rate is within [0.5,1.5]*alpha without per-scene retuning, with sigma(.), ell, nu fitted
    ONCE on dev scenes. On fault-free data the per-view false-alarm rate is <=5%, availability is >=90%,
    and the gate changes trajectory and fused-surface error by <=5% vs the pipeline without it; on natural
    failures the gated test bed narrows the gap to the reference points MASt3R-SfM and VGGT (context only).'
  falsification_criterion: Falsified if mean(T/(n-2)) leaves 1+/-0.1 or the false-alarm rate leaves its
    band (the model is misspecified and the MDB of H1 cannot be trusted), the price of gating on clean
    data exceeds 5%, or availability falls below 90%. Reference points are context only; no claim to beat
    them.
  independent_variables: [data_kind_clean_or_natural, dataset]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    data_kind: [clean, natural_failures]
baselines: [no_gate, gate_surface_evidence, mast3r_sfm, vggt, colmap_sfm]
metrics:
  primary: [mean_T_over_dof, false_alarm_vs_alpha, false_alarm_rate, availability, ate_rmse_sim3, fscore,
    pose_auc_at_5_10_30deg]
  adequacy_mean_T_tolerance: 0.1
  adequacy_false_alarm_band: [0.5, 1.5]
  clean_cost_threshold: 0.05
  availability_threshold: 0.9
implemented: false

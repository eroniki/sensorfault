# Design v2.3: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h6_price_of_monitoring_reference_points
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H6
  prediction: On fault-free data the per-view false-alarm rate is <=5%, availability is >=90%, and the
    gate changes trajectory and fused-surface error by <=5% vs the pipeline without it; on natural failures
    the gated test bed narrows the gap to the reference points MASt3R-SfM and VGGT (context only).
  falsification_criterion: Falsified if the price of gating on clean data exceeds 5% or availability falls
    below 90%. Reference points are context only; no claim to beat them.
  independent_variables: [data_kind_clean_or_natural, dataset]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    data_kind: [clean, natural_failures]
baselines: [no_gate, gate_surface_evidence, mast3r_sfm, vggt, colmap_sfm]
metrics:
  primary: [false_alarm_rate, availability, ate_rmse_sim3, fscore, pose_auc_at_5_10_30deg]
  clean_cost_threshold: 0.05
  availability_threshold: 0.9
implemented: false

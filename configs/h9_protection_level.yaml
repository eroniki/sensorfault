# Design v2.4: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h9_protection_level
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H9
  prediction: Under single-fault injections satisfying assumptions A1-A4 (one faulty view, calibrated
    noise, linear response, uncorrupted surface), with a fault at the MDB, the realised error of the output
    q exceeds PL_q = max_i sqrt(lambda_0 * s_i^T Sigma~_r s_i) + z_q*sigma_q (ellipsoid form from the
    MEASURED Sigma_r; Sigma~_r = Sigma_r - A (A^T Sigma_r^-1 A)^-1 A^T; lambda_0 = noncentrality of the
    energy test at missed-detection beta) in at most beta+5 points of runs; under two faulty views in
    a region or a model-level fault (assumptions fail) the exceedance is >2*beta, documenting where the
    bound does not hold. OPTIONAL; first item cut.
  falsification_criterion: Falsified if the exceedance under single faults is above beta+5 points.
  independent_variables: [fault_size_relative_to_mdb, n_faulty_views, model_level_fault, query_output_q]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    fault_size_over_mdb: [0.5, 1, 2]
    n_faulty_views_in_region: [1, 2]
    model_level: [false, true]
baselines: [gate_surface_evidence, oracle_gate]
metrics:
  primary: [pl_exceedance_rate, lambda_0, sensitivity_vectors_s_i]
  single_fault_tolerance_points: 5
  violated_assumption_factor: 2
implemented: false
optional: true
sensitivities: estimated by perturbing a view and refitting (subset of scenes)

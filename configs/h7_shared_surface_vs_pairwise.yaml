# Design v2.5: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h7_shared_surface_vs_pairwise
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H7
  prediction: '(a) Efficiency: closed-form shared-surface gate time grows linearly with the number of
    views N (log-log slope <1.2) while the pairwise gate grows with N*d_bar (slope >1.5 on dense graphs);
    for N>=100 at d_bar>=10 the surface gate is >=2x faster; for sparse graphs the pairwise gate is cheaper
    (break-even reported). (b) Robustness: power within 5 points of the pairwise gate (non-inferior) in
    the H1 regimes. (c) Closed form vs optimised: within 3 points of the fixed-budget MCMC surface with
    explicit leave-view-out refits at a fraction of its cost; per-region posterior, protection level and
    view count with reported coverage. (d) Association: robust to view order; cold start and association
    failure measured.'
  falsification_criterion: Falsified if (a) speed-up <2x at dense overlap or slopes do not separate, (b)
    the pairwise gate is >5 points better, or (c) the closed form is >3 points worse than the optimised
    surface.
  independent_variables: [number_of_views_N, mean_covisibility_degree, surface_variant, view_order]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    N: [25, 50, 100, 200]
    d_bar: [2, 5, 10, 20]
    surface_variant: [closed_form, single_covariance, mcmc_fixed_budget]
    view_order: [sequential, random, adversarial]
baselines: [gate_pairwise_evidence, gate_surface_evidence, gate_surface_single_covariance, gate_surface_mcmc_fixed_budget]
metrics:
  primary: [detection_power_at_fa_0.05, wall_clock_s, gpu_mem_gb, loglog_slope_vs_N, region_posterior_var,
    region_protection_level, region_n_views, pl_coverage]
  speedup_threshold: 2.0
  noninferiority_margin_points: 5
  closed_form_gap_points: 3
implemented: false

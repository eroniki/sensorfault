# Design v2.3: view-level fault detection and exclusion (integrity monitoring) for learned-depth reconstruction.
# Gate = contribution; differentiable, renderable pose graph = test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h5_placement_soft_downweighting
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H5
  prediction: In the sub-noise regime, gating BEFORE pose graph optimisation gives lower trajectory error
    than (i) the same statistic applied after the graph and (ii) soft per-view down-weighting inside the
    differentiable optimisation; the gate combined with a robust kernel is at least as accurate as either
    alone.
  falsification_criterion: Falsified if soft down-weighting matches the gate in the sub-noise regime (it
    would then suffice), if gating after the graph matches gating before it, or if the combination is
    worse than the better component.
  independent_variables: [gate_placement, soft_view_weights, robust_kernel]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    gate_placement: [none, before_pgo, after_pgo]
    soft_view_weights: [true, false]
    robust_kernel: [none, huber, geman_mcclure_gnc]
baselines: [no_gate, gate_surface_evidence, soft_view_weights, rk_huber, rk_gm_gnc]
metrics:
  primary: [ate_rmse_sim3, rpe]
implemented: false

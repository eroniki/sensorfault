# Design v2: view-level gate (contribution) + monocular-depth test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h2_evidence_vs_chi2
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H2
  prediction: At a fixed 5% false-exclusion rate the evidence criterion exceeds the chi-square gate by
    >=10 points of detection power, only where heteroscedastic depth noise, grazing geometry, occlusion
    or non-Gaussian residuals break the chi-square assumptions; it ties under idealised Gaussian noise
    (Proposition 1).
  falsification_criterion: 'Falsified if there is no gain >=10 points in any pre-registered regime. Fallback:
    report the gate with the chi-square statistic; keep the entropy relation as an equivalence result.'
  independent_variables: [noise_model, grazing_fraction, occlusion_fraction, residual_distribution]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    noise_model: [gaussian_homoscedastic, depth_dependent, heavy_tailed]
baselines: [gate_surface_chi2, gate_surface_evidence]
metrics:
  primary: [power_at_fer_0.05]
  power_gain_threshold_points: 10
implemented: false

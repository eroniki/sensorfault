# Design v3: depth-only view gate on Gaussian surfels whose uncertainty renders (3DGS camp).
# Faults are regional and appearance-driven; the gate must beat cheap baselines. Old configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: ablations_gate
status: preregistered_draft
design: v3_rendered_uncertainty_gate
hypothesis:
  id: H6
  prediction: see h6
  falsification_criterion: see h6
  independent_variables: [variant]
  controlled_variables: [depth_maps, poses, surfel_fit, fault_seeds, scene_set]
  levels: {}
ablations:
- {id: A0, name: 'full gate (rendered 9x9 uncertainty, leave-view-out subtraction, no spawning, combined
    statistic)'}
- {id: A1, name: joint surface (no leave-view-out)}
- {id: A2, name: keep surfels supported only by the tested view}
- {id: A3, name: unwhitened residual (constant sigma)}
- {id: A4, name: energy statistic only}
- {id: A5, name: region-scan statistic only}
- {id: A6, name: information deflated by n_eff/n}
- {id: A7, name: FisherRF-style diagonal Fisher uncertainty}
- {id: A8, name: Bayes-Rays-style perturbation-field uncertainty}
- {id: A9, name: colour gradients allowed to update geometry (violates the appearance-block rule)}
- {id: A10, name: evidence (Bayes-factor) criterion instead of chi-square (equivalence check)}
baselines: [gate, gate_joint, gate_keep_unsupported, gate_unwhitened, gate_deflated, gate_fisherrf_diag,
  gate_bayesrays]
metrics:
  primary: [false_alarm_rate, detection_power_at_fa_0.05]
implemented: false

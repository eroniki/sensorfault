# Design v3.1: depth-only view gate on Gaussian surfels whose uncertainty renders (3DGS camp).
# Reference design: docs/design-3dgs-bayes.md (sections 1-4, 9, 10; section 8 belongs to a separate paper).
# Faults are regional and appearance-driven; the gate must beat cheap baselines. Old configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: breakdown_misspecified_measurement_model
status: preregistered_draft
design: v3_rendered_uncertainty_gate
hypothesis:
  id: breakdown
  prediction: sigma(.) shape, ell or tails misfitted (ell off by 2x, sigma shape off, no nugget), or per-view
    heterogeneity omega larger than calibrated; the scene temperature fixes level errors only.
  falsification_criterion: Report the false-alarm rate and power under each misspecification.
  independent_variables: [ell_error_factor, sigma_shape_error, nugget, omega]
  controlled_variables: [depth_maps, poses, surfel_fit, fault_seeds, scene_set]
  levels:
    ell_error_factor: [0.5, 1, 2]
    sigma_shape_error: [none, range_slope_x1.5]
    nugget: [0.0, 0.2]
    omega: [0.0, 0.02, 0.05, 0.1]
baselines: [no_gate, gate, aligned_rms]
metrics:
  primary: [detection_power_at_fa_0.05, untestable_rate, fscore]
implemented: false

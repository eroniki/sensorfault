extends: base.yaml
id: breakdown_majority_correlated
status: preregistered_draft
hypothesis:
  id: BREAKDOWN-majority_correlated
  prediction: >-
    Expected honest negative: the consensus follows the faulty majority; elimination should flag the GOOD minority or report no_consensus. Report the failure rate.
  falsification_criterion: >-
    This is a required honest-negative experiment. The prediction fails if the method succeeds where a failure
    is predicted; either outcome is reported unconditionally with full CIs. Description: Majority faulty with same-sign bias (>= half the sensors share the same bias).
  independent_variables: [fault_magnitude, which_sensor_faulty, K]
  controlled_variables: [scenes, seeds, noise_models, overlap]
baselines: [median_fusion, consistency_voting, loo_chi2, subset_msac, openmvs, splat_consensus]
metrics: {primary: chamfer, secondary: [detection_precision, detection_recall, attribution_accuracy]}
scenarios:
  - {name: majority_correlated, faulty: [0, 1, 2], n_sensors: 5, cell: {kind: depth_bias_const, params: {frac_of_median_range: 0.03, sign: 1}, profile: step}}

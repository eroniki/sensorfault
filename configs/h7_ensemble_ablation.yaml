# Design v2: view-level gate (contribution) + monocular-depth test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: h7_ensemble_ablation
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: H7
  prediction: '(a) Shared failures: on natural failures, models that overlap in training data fail on
    the same views more often than independence predicts: for each pair of models the lift of the joint
    failure frequency is >=2 and the phi coefficient >=0.3. (b) Where voting breaks: on views where >=
    half of the models fail, cross-model voting detects the failing view in <=20% of cases (the models
    agree with each other) while the single-model gate against the surface detects >=20 points more; the
    converse (views the surface cannot support) is reported, not predicted. (c) Value of the ensemble:
    adding the models to the gate raises detection power at 5% false exclusion by >=5 points over the
    single-model gate, which would justify the Mx inference cost.'
  falsification_criterion: Falsified if (a) the lift interval includes 1 (failures independent), (b) voting
    power on common-mode views is within 10 points of the gate, or (c) the ensemble gain interval includes
    0.
  independent_variables: [M, models_in_ensemble, natural_or_injected_common_mode, view_support_of_surface]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    M: [2, 3, 4]
    models: [depth_pro, unidepth, metric3d_v2, moge]
    fault_source: [natural, injected_common_mode]
baselines: [cross_model_voting, gate_surface_evidence, gate_ensemble]
metrics:
  primary: [joint_failure_lift, phi_coefficient, power_at_fer_0.05, inference_cost_x]
implemented: false
depth_models: depth_models/depth_models.yaml

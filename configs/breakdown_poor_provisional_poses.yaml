# Design v2: view-level gate (contribution) + monocular-depth test bed. Old sensor-level configs: configs/legacy_sensor_faults/.
extends: base.yaml
id: breakdown_poor_provisional_poses
status: preregistered_draft
design: v2_view_level_gate
hypothesis:
  id: breakdown
  prediction: Provisional poses of poor quality corrupt the gate.
  falsification_criterion: Report gate error versus provisional-pose error; test whether one re-gate pass
    recovers.
  independent_variables: [provisional_pose_noise_deg]
  controlled_variables: [images, matches, depth_maps, pose_graph_solver, fault_seeds, scene_set]
  levels:
    provisional_pose_noise_deg: [0.5, 1, 2, 5]
baselines: [no_gate, gate_surface_evidence, rk_huber, vote_median, colmap_geom_consistency]
metrics:
  primary: [ate_rmse_sim3, fscore, precision, recall]
implemented: false

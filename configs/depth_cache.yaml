# Depth-cache defaults (CLI flags override). Cache is git-ignored: keep root under data/ or outputs/.
root: data/depth_cache
device: cuda
dtype: float16        # float16 | float32 (stored depth/confidence)
models: [depth_pro, metric3d_v2, unidepth_v2, depth_anything_v2]
# depth_anything_v2 stores raw relative inverse depth (kind="relative_inverse_depth"); the fit aligns it.
datasets:
  matrixcity: {scene: block3}   # needs data/matrixcity/<scene>/{transforms.json,images/}; not downloaded here
  usegeo: stub                  # needs M's approval before any download
  eth3d: stub                   # needs M's approval; licence unchecked
# Per-model build() options (also --opt model.key=value). Metric3D clamps depth at 300 m by default,
# which is below most aerial ground truth; raise it for aerial runs and re-run (the cache does not
# notice settings changes, so use a fresh --root).
model_options: {}
#  metric3d_v2: {max_depth_m: 1000}

name: ci-sensorfault
# Runs only when code/sensorfault (or this file) changes. Papers, docs and
# depthcal-gs changes do not start it.
on:
  push:
    branches: [main]
    paths: ["code/sensorfault/**", ".github/workflows/ci-sensorfault.yml"]
  pull_request:
    paths: ["code/sensorfault/**", ".github/workflows/ci-sensorfault.yml"]
  workflow_dispatch:
concurrency:
  # A new push to the same PR or branch cancels the run still in progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: code/sensorfault
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: code/sensorfault/pyproject.toml
      - name: Install (CPU only, core deps + dev tools)
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests (fast)
        run: python -m pytest -q -m "not gpu and not data and not slow"
  slow:
    # The gate end-to-end and bunny-golden tests take about 11 minutes. Run
    # them once, on one Python, after a merge to main or by hand, not on
    # every PR push.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/sensorfault/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests (slow)
        run: python -m pytest -q -m "slow and not gpu and not data"

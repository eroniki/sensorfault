name: ci-depthcal-gs
# Runs only when code/depthcal-gs (or this file) changes.
on:
  push:
    branches: [main]
    paths: ["code/depthcal-gs/**", ".github/workflows/ci-depthcal-gs.yml"]
  pull_request:
    paths: ["code/depthcal-gs/**", ".github/workflows/ci-depthcal-gs.yml"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  depthcal-gs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/depthcal-gs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: code/depthcal-gs/pyproject.toml
      - name: Install (CPU only)
        run: python -m pip install -e . pytest
      - name: Tests (the stage-1 test needs torch and is not run here)
        run: python -m pytest -q --ignore=tests/test_stage1.py
